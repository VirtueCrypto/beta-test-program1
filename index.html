<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beta Testing Program Dashboard</title>
  <link rel="stylesheet" href="beta dashboard.css">
</head>
<body>
  <main class="bt-dashboard">
    <header class="bt-header">
      <div>
        <span class="bt-eyebrow">Program Overview</span>
        <h1 class="bt-title" id="dashboard-title">Loading Dashboard...</h1>
        <p class="bt-subtitle" id="dashboard-summary"></p>
      </div>
      <div class="bt-actions">
        <button class="bt-button bt-button-primary">Export Report</button>
      </div>
    </header>

    <!-- Example Card Section powered by your JSON data structure -->
    <section class="bt-grid bt-grid-4">
      <div class="bt-card bt-kpi">
        <span class="bt-kpi-label">Participants Enrolled</span>
        <div class="bt-kpi-value" id="kpi-enrolled">0</div>
        <div class="bt-kpi-bar"><span style="width: 0%;"></span></div>
      </div>
    </section>
  </main>

  <script>
    // Simple script to load and bind your beta testing dashboard.json data
    fetch('beta testing dashboard.json')
      .then(response => response.json())
      .then(data => {
        document.getElementById('dashboard-title').textContent = data.dashboard.title;
        document.getElementById('dashboard-summary').textContent = data.dashboard.summary;
        
        const enrolledCard = data.metrics.summary_cards.find(c => c.id === 'enrolled');
        if (enrolledCard) {
          document.getElementById('kpi-enrolled').textContent = enrolledCard.value;
        }
      })
      .catch(error => console.error('Error loading dashboard config:', error));
  </script>
</body>
</html>
